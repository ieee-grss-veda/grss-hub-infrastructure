# userServiceAccount:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::870461445243:role/grss-veda-staging
dask-gateway:
  gateway:
    backend:
      scheduler:
        extraPodConfig:
          nodeSelector:
            2i2c/hub-name: staging
      worker:
        extraPodConfig:
          nodeSelector:
            2i2c/hub-name: staging

jupyterhub:
  ingress:
    hosts: [hub.staging.veda.grss-ieee.org]
    tls:
    - hosts: [hub.staging.veda.grss-ieee.org]
      secretName: https-auto-tls
  hub:
    config:
      GenericOAuthenticator:
        authorize_url: https://auth.staging.veda.grss-ieee.org/realms/veda/protocol/openid-connect/auth
        token_url: https://auth.staging.veda.grss-ieee.org/realms/veda/protocol/openid-connect/token
        userdata_url: https://auth.staging.veda.grss-ieee.org/realms/veda/protocol/openid-connect/userinfo
        oauth_callback_url: https://hub.staging.veda.grss-ieee.org/hub/oauth_callback
        logout_redirect_url: https://auth.staging.veda.grss-ieee.org/realms/veda/protocol/openid-connect/logout?client_id=jupyterhub&post_logout_redirect_uri=https%3A%2F%2Fhub.staging.veda.grss-ieee.org
      # Phase 3: usage-quotas. Library is baked into the hub image via
      # helm-charts/images/hub/requirements.txt. scope_backup_strategy.empty is
      # single-resource per the library schema; memory is enforced for all users
      # via this backup. CPU is collected (in prometheus_usage_metrics) but not
      # enforced by the backup. To enforce CPU, add a `policy:` entry scoped to
      # a JupyterHub group (e.g., "JupyterHub Basic User"). Tunable values below.
      UsageQuotaManager:
        prometheus_scrape_interval: 60
        prometheus_url: http://support-prometheus-server.support.svc.cluster.local
        prometheus_usage_metrics:
          memory: kube_pod_container_resource_requests{resource='memory'}
          cpu: kube_pod_container_resource_requests{resource='cpu'}
        scope_backup_strategy:
          empty:
            resource: memory
            limit:
              value: 1000
              unit: GiB-hours
            window: 7
          intersection: max
    extraConfig:
      11-enforce-usage-quotas: |
        from jupyterhub_usage_quotas.manager import SpawnException, UsageQuotaManager

        quota_manager = UsageQuotaManager(config=c)

        async def quota_pre_spawn_hook(spawner):
            try:
                output = await quota_manager.enforce(spawner)
                launch_flag = output["allow_server_launch"]
            except Exception:
                raise SpawnException(
                    status_code=424,
                    log_message="Spawn failed due to a failed dependency in the usage quota system. Please contact your hub admin for assistance.",
                )
            if launch_flag is False:
                raise SpawnException(
                    status_code=403,
                    log_message=f"{output['error']['message']}",
                    html_message=(
                        f"<p>Compute {output['quota']['resource']} quota limit exceeded.</p>"
                        f"<p style='font-size:100%'>You have used "
                        f"<span style='color:var(--bs-red)'>{output['quota']['used']:.2f}</span>"
                        f" / {output['quota']['limit']['value']:.2f} {output['quota']['limit']['unit']}"
                        f" in the last {output['quota']['window']} days.</p>"
                        f"<p style='font-size:100%'>Contact your JupyterHub admin if you need additional quota.</p>"
                        f"<i style='font-size:100%;color:var(--bs-gray)'>Last updated: {output['timestamp']} (UTC).</i>"
                    ),
                )
        c.KubeSpawner.pre_spawn_hook = quota_pre_spawn_hook
  singleuser:
    nodeSelector:
      2i2c/hub-name: staging
    profileList:
    - display_name: Choose your environment and resources
      default: true
      profile_options:
        image:
          display_name: Environment
          dynamic_image_building:
            enabled: true
          unlisted_choice:
            enabled: true
            display_name: Custom image
            display_name_in_choices: Bring your own image
            validation_regex: ^.+:.+$
            validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
            kubespawner_override:
              image: '{value}'
          choices:
            01-modify-pangeo:
              display_name: Modified Pangeo Notebook
              description: Pangeo based notebook with a Python environment
              default: true
              kubespawner_override:
                image: public.ecr.aws/nasa-veda/pangeo-notebook-veda-image:2025.08.14-v2
                init_containers:
                # this container uses nbgitpuller to mount https://github.com/NASA-IMPACT/veda-docs/ for user pods
                # image source: https://github.com/NASA-IMPACT/jupyterhub-gitpuller-init
                - name: jupyterhub-gitpuller-init
                  image: public.ecr.aws/nasa-veda/jupyterhub-gitpuller-init:97eb45f9d23b128aff810e45911857d5cffd05c2
                  env:
                  - name: TARGET_PATH
                    value: veda-docs
                  - name: SOURCE_REPO
                    value: https://github.com/NASA-IMPACT/veda-docs
                  volumeMounts:
                  - name: home
                    mountPath: /home/jovyan
                    subPath: '{escaped_username}'
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
            02-qgis:
              display_name: QGIS on Linux Desktop
              description: Linux desktop in the browser, with qgis installed
              kubespawner_override:
                # Launch people directly into the Linux desktop when they start
                default_url: /desktop
                # Built from https://github.com/2i2c-org/nasa-qgis-image
                image: quay.io/2i2c/nasa-qgis-image:607df3f5c661
        resource_allocation:
          display_name: Resource Allocation
          choices:
            mem_1_9:
              display_name: 1.9 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub Basic User
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 1991244775
                mem_limit: 1991244775
                cpu_guarantee: 0.2328125
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r6g.xlarge
              default: true
            mem_3_7:
              display_name: 3.7 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub Basic User
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 3982489550
                mem_limit: 3982489550
                cpu_guarantee: 0.465625
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r6g.xlarge
            mem_7_4:
              display_name: 7.4 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 7964979101
                mem_limit: 7964979101
                cpu_guarantee: 0.93125
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r6g.xlarge

