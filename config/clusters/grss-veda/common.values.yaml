nfs:
  enabled: true
  volumeReporter:
    enabled: false
  pv:
    enabled: true
    # from https://docs.aws.amazon.com/efs/latest/ug/mounting-fs-nfs-mount-settings.html
    mountOptions:
    - rsize=1048576
    - wsize=1048576
    - timeo=600
    - soft   # We pick soft over hard, so NFS lockups don't lead to hung processes
    - retrans=2
    - noresvport
dask-gateway:
  enabled: true
jupyterhub:
  custom:
    daskhubSetup:
      enabled: true
    singleuserAdmin:
      extraVolumeMounts:
        # /allusers is an extra mount point for admins to access to all users'
        # home dirs
      - name: home
        mountPath: /home/jovyan/allusers
        readOnly: false
      - name: home
        mountPath: /home/rstudio/allusers
        readOnly: false
        # mounts below are copied from basehub's values that we override by
        # specifying extraVolumeMounts (lists get overridden when helm values
        # are combined)
      - name: home
        mountPath: /home/jovyan/shared-readwrite
        subPath: _shared
      - name: home
        mountPath: /home/rstudio/shared-readwrite
        subPath: _shared
    homepage:
      templateVars:
        org:
          name: IEEE GRSS
          logo_url: https://www.grss-ieee.org/wp-content/uploads/2020/12/grss.png
          url: https://www.grss-ieee.org/
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        operated_by:
          name: IEEE GRSS
          url: https://www.grss-ieee.org/
        funded_by:
          name: IEEE GRSS
          url: https://www.grss-ieee.org/
  hub:
    allowNamedServers: true
    config:
      JupyterHub:
        authenticator_class: generic-oauth
      GenericOAuthenticator:
        client_id: jupyterhub
        authorize_url: https://dev-auth.grss.veda.cloud/realms/veda/protocol/openid-connect/auth
        token_url: https://dev-auth.grss.veda.cloud/realms/veda/protocol/openid-connect/token
        userdata_url: https://dev-auth.grss.veda.cloud/realms/veda/protocol/openid-connect/userinfo
        login_service: Keycloak
        username_claim: preferred_username
        scope:
        - openid
        - profile
        - email
  singleuser:
    cloudMetadata:
      blockWithIptables: false
    defaultUrl: /lab
    storage:
      extraVolumeMounts:
      - name: home
        mountPath: /home/rstudio
        subPath: '{escaped_username}'
      - name: home
        mountPath: /home/jovyan/shared-public
        subPath: _shared-public
        readOnly: false
      - name: home
        mountPath: /home/rstudio/shared-public
        subPath: _shared-public
        readOnly: false
      - name: home
        mountPath: /home/jovyan/shared
        subPath: _shared
        readOnly: true
      - name: home
        mountPath: /home/rstudio/shared
        subPath: _shared
        readOnly: true
      - name: dev-shm
        mountPath: /dev/shm
    profileList:
    - display_name: Choose your environment and resources
      default: true
      profile_options:
        image:
          display_name: Environment
          dynamic_image_building:
            enabled: true
          unlisted_choice:
            enabled: true
            display_name: Custom image
            display_name_in_choices: Bring your own image
            validation_regex: ^.+:.+$
            validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
            kubespawner_override:
              image: '{value}'
          choices:
            01-modify-pangeo:
              display_name: Modified Pangeo Notebook
              description: Pangeo based notebook with a Python environment
              kubespawner_override:
                image: public.ecr.aws/nasa-veda/pangeo-notebook-veda-image:2025.08.14-v2
                init_containers:
                # this container uses nbgitpuller to mount https://github.com/NASA-IMPACT/veda-docs/ for user pods
                # image source: https://github.com/NASA-IMPACT/jupyterhub-gitpuller-init
                - name: jupyterhub-gitpuller-init
                  image: public.ecr.aws/nasa-veda/jupyterhub-gitpuller-init:97eb45f9d23b128aff810e45911857d5cffd05c2
                  env:
                  - name: TARGET_PATH
                    value: veda-docs
                  - name: SOURCE_REPO
                    value: https://github.com/NASA-IMPACT/veda-docs
                  volumeMounts:
                  - name: home
                    mountPath: /home/jovyan
                    subPath: '{escaped_username}'
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
            02-rocker:
              display_name: Rocker Geospatial with RStudio
              description: R environment with many geospatial libraries pre-installed
              kubespawner_override:
                image: rocker/binder:4.4
                image_pull_policy: Always
                  # Launch RStudio after the user logs in
                default_url: /rstudio
                  # Ensures container working dir is homedir
                  # https://github.com/2i2c-org/infrastructure/issues/2559
                working_dir: /home/rstudio
            03-qgis:
              display_name: QGIS on Linux Desktop
              description: Linux desktop in the browser, with qgis installed
              kubespawner_override:
                  # Launch people directly into the Linux desktop when they start
                default_url: /desktop
                  # Built from https://github.com/2i2c-org/nasa-qgis-image
                image: quay.io/2i2c/nasa-qgis-image:607df3f5c661
        resource_allocation:
          display_name: Resource Allocation
          choices:
            mem_1_9:
              display_name: 1.9 GB RAM, upto 3.7 CPUs
              kubespawner_override:
                mem_guarantee: 1991244775
                mem_limit: 1991244775
                cpu_guarantee: 0.2328125
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
              default: true
            mem_3_7:
              display_name: 3.7 GB RAM, upto 3.7 CPUs
              kubespawner_override:
                mem_guarantee: 3982489550
                mem_limit: 3982489550
                cpu_guarantee: 0.465625
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
            # mem_7_4:
            #   display_name: 7.4 GB RAM, upto 3.7 CPUs
            #   kubespawner_override:
            #     mem_guarantee: 7964979101
            #     mem_limit: 7964979101
            #     cpu_guarantee: 0.93125
            #     cpu_limit: 3.725
            #     node_selector:
            #       node.kubernetes.io/instance-type: r5.xlarge
            # mem_14_8:
