# userServiceAccount:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::870461445243:role/grss-veda-prod
jupyterhub:
  ingress:
    hosts: [hub.veda.grss-ieee.org]
    tls:
    - hosts: [hub.veda.grss-ieee.org]
      secretName: https-auto-tls
  hub:
    config:
      GenericOAuthenticator:
        authorize_url: https://auth.veda.grss-ieee.org/realms/veda/protocol/openid-connect/auth
        token_url: https://auth.veda.grss-ieee.org/realms/veda/protocol/openid-connect/token
        userdata_url: https://auth.veda.grss-ieee.org/realms/veda/protocol/openid-connect/userinfo
        oauth_callback_url: https://hub.veda.grss-ieee.org/hub/oauth_callback
  singleuser:
    nodeSelector:
      2i2c/hub-name: prod
    profileList:
    - display_name: Choose your environment and resources
      default: true
      profile_options:
        resource_allocation:
          display_name: Resource Allocation
          choices:
            mem_1_9:
              display_name: 1.9 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub Basic User
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 1991244775
                mem_limit: 1991244775
                cpu_guarantee: 0.2328125
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
              default: true
            mem_3_7:
              display_name: 3.7 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub Basic User
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 3982489550
                mem_limit: 3982489550
                cpu_guarantee: 0.465625
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
            mem_7_4:
              display_name: 7.4 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub Basic User
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 7964979101
                mem_limit: 7964979101
                cpu_guarantee: 0.93125
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
            mem_14_8:
              display_name: 14.8 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 15929958203
                mem_limit: 15929958203
                cpu_guarantee: 1.8625
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
            mem_29_7:
              display_name: 29.7 GB RAM, upto 3.7 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 31859916406
                mem_limit: 31859916406
                cpu_guarantee: 3.725
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
            mem_60_6:
              display_name: 60.6 GB RAM, upto 15.6 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 65094448840
                mem_limit: 65094448840
                cpu_guarantee: 7.8475
                cpu_limit: 15.695
                node_selector:
                  node.kubernetes.io/instance-type: r5.4xlarge
            mem_121_2:
              display_name: 121.2 GB RAM, upto 15.6 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub User
              kubespawner_override:
                mem_guarantee: 130188897681
                mem_limit: 130188897681
                cpu_guarantee: 15.695
                cpu_limit: 15.695
                node_selector:
                  node.kubernetes.io/instance-type: r5.4xlarge
            gpu_t4:
              display_name: NVIDIA T4 GPU, ~16 GB GPU RAM, ~16 GB RAM, ~4 CPUs
              allowed_groups:
                - JupyterHub Admin
                - JupyterHub GPU User
              kubespawner_override:
                environment:
                  NVIDIA_DRIVER_CAPABILITIES: compute,utility
                mem_guarantee: 14G
                mem_limit: 14G
                cpu_guarantee: 3.725
                cpu_limit: 3.725
                node_selector:
                  node.kubernetes.io/instance-type: g4dn.xlarge
                extra_resource_limits:
                  nvidia.com/gpu: "1"
dask-gateway:
  gateway:
    backend:
      scheduler:
        extraPodConfig:
          nodeSelector:
            2i2c/hub-name: prod
      worker:
        extraPodConfig:
          nodeSelector:
            2i2c/hub-name: prod

