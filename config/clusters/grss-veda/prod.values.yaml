basehub:
  userServiceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::597746869805:role/nasa-ghg-hub-prod
  jupyterhub:
    ingress:
      hosts: [hub.veda.grss.cloud]
      tls:
      - hosts: [hub.veda.grss.cloud]
        secretName: https-auto-tls
    hub:
      config:
        GitHubOAuthenticator:
          oauth_callback_url: https://hub.veda.grss.cloud/hub/oauth_callback
    singleuser:
      nodeSelector:
        2i2c/hub-name: prod
  dask-gateway:
    gateway:
      backend:
        scheduler:
          extraPodConfig:
            nodeSelector:
              2i2c/hub-name: prod
        worker:
          extraPodConfig:
            nodeSelector:
              2i2c/hub-name: prod

