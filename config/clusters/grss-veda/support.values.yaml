prometheusIngressAuthSecret:
  enabled: true

prometheus:
  server:
    persistentVolume:
      size: 100Gi
    ingress:
      enabled: true
      hosts:
        - prometheus.veda.grss.cloud
      tls:
        - secretName: prometheus-tls
          hosts:
            - prometheus.veda.grss.cloud

grafana:
  grafana.ini:
    server:
      root_url: https://grafana.veda.grss.cloud/
  auth.github:
    enabled: true
    allowed_organizations: ieee-grss-veda
  persistence:
    # We don't need 10Gi on the Grafana persistent directory
    size: 1Gi
  ingress:
    hosts:
      - grafana.veda.grss.cloud
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.veda.grss.cloud

cluster-autoscaler:
  enabled: true
  autoDiscovery:
    clusterName: grss-veda
  awsRegion: us-west-2

calico:
  enabled: true
